<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JUS</title>
<meta name="description" content="La recharge au juste prix. Compare. Branche. Économise.">
<meta name="theme-color" content="#0d1110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JUS">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root {
  --bg: #f3f5ee;
  --surface: #ffffff;
  --surface-2: #e9ede2;
  --ink: #121816;
  --ink-2: #4f5853;
  --line: rgba(18, 24, 22, 0.14);
  --lime: #dcff5e;
  --lime-strong: #bfe83a;
  --lime-soft: rgba(191, 232, 58, 0.3);
  --lime-text: #3f5600;
  --logo-text: #121816;
  --dark: #121816;
  --sea: #e3e8dc;
  --land: #ffffff;
  --land-line: #b3c497;
  --danger: #b8321f;
  --spark: #8fc400;
  --font: "Manrope", "Segoe UI", Roboto, Arial, sans-serif;
  --head-h: 66px;
  --nav-h: 64px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1110; --surface: #171d1b; --surface-2: #232b28; --ink: #f2f5f1; --ink-2: #b2bcb7; --line: rgba(255, 255, 255, 0.14);
    --lime-strong: #dcff5e; --lime-soft: rgba(220, 255, 94, 0.16); --lime-text: #dcff5e; --logo-text: #dcff5e; --spark: #dcff5e;
    --sea: #0d1110; --land: #1a211f; --land-line: #3c4a2b; --danger: #ff8a7a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1110; --surface: #171d1b; --surface-2: #232b28; --ink: #f2f5f1; --ink-2: #b2bcb7; --line: rgba(255, 255, 255, 0.14);
  --lime-strong: #dcff5e; --lime-soft: rgba(220, 255, 94, 0.16); --lime-text: #dcff5e; --logo-text: #dcff5e; --spark: #dcff5e;
  --sea: #0d1110; --land: #1a211f; --land-line: #3c4a2b; --danger: #ff8a7a; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; background: var(--bg); scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--head-h)); }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--lime-strong); outline-offset: 3px; border-radius: 10px; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 23px; height: 23px; flex: none; }

/* En-tête */
.head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 10px; padding: 9px 16px; max-width: 560px; margin: 0 auto; }
.logo { display: flex; align-items: center; gap: 9px; text-decoration: none; }
.logo-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--lime); color: var(--dark); display: grid; place-items: center; }
.logo-mark svg { width: 19px; height: 19px; overflow: visible; }
.logo-mark { position: relative; animation: jus-flash 3.2s ease-out infinite; }
.bolt-spark { stroke: #ffffff; stroke-dasharray: 24 76; stroke-dashoffset: 100; animation: jus-spark 1.4s linear infinite; }
@keyframes jus-spark { to { stroke-dashoffset: 0; } }
@keyframes jus-flash {
  0%, 68%, 100% { box-shadow: 0 0 0 0 rgba(220, 255, 94, 0); }
  76% { box-shadow: 0 0 16px 4px rgba(220, 255, 94, 0.9); }
  90% { box-shadow: 0 0 26px 8px rgba(220, 255, 94, 0); }
}
@media (prefers-reduced-motion: reduce) { .logo-mark, .bolt-spark { animation: none; } .bolt-spark { opacity: 0; } }
.logo-word { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; color: var(--logo-text); line-height: 1; }
.spacer { flex: 1; }
.mycar { display: flex; align-items: center; gap: 9px; min-height: 42px; padding: 6px 14px 6px 12px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); text-align: left; line-height: 1.2; }
.mycar b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 9.5em; }
.mycar > span { min-width: 0; }
.mycar span { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.mini-batt { width: 34px; height: 18px; flex: none; }

main { max-width: 560px; margin: 0 auto; padding: 14px 16px calc(var(--nav-h) + 40px); }
.view-map main { padding: 0; max-width: none; }

.title { font-size: 23px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.2; margin: 2px 0 14px; }
.h3 { font-size: 18px; font-weight: 800; margin: 24px 0 10px; }

/* Tri */
.sorter { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: var(--surface-2); padding: 5px; border-radius: 16px; }
.sorter button { min-height: 42px; border-radius: 12px; font-weight: 800; font-size: 14px; text-align: center; color: var(--ink-2); line-height: 1.15; padding: 4px; }
.sorter button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 0 var(--line), inset 0 0 0 2px var(--ink); }

/* Meilleur choix */
.best { position: relative; isolation: isolate; overflow: hidden; margin-top: 16px; background: var(--dark); color: #f2f5f1; border-radius: 20px; padding: 18px; animation: jus-flash-card 3.2s ease-out infinite; }
.best::before { content: ""; position: absolute; z-index: -2; left: 50%; top: 50%; width: 200%; aspect-ratio: 1; transform: translate(-50%, -50%) rotate(0deg);
  background: conic-gradient(from 0deg, rgba(220, 255, 94, 0.22) 0deg 290deg, rgba(220, 255, 94, 0.75) 325deg, #ffffff 348deg, rgba(220, 255, 94, 0.22) 360deg);
  animation: jus-ring 2.8s linear infinite; }
.best::after { content: ""; position: absolute; z-index: -1; inset: 2.5px; border-radius: 17.5px; background: var(--dark); }
@keyframes jus-ring { to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes jus-flash-card {
  0%, 68%, 100% { box-shadow: 0 0 0 0 rgba(220, 255, 94, 0); }
  76% { box-shadow: 0 0 22px 3px rgba(220, 255, 94, 0.55); }
  92% { box-shadow: 0 0 34px 8px rgba(220, 255, 94, 0); }
}
@media (prefers-reduced-motion: reduce) { .best, .best::before { animation: none; } }
.kicker { display: inline-block; background: var(--lime); color: var(--dark); font-weight: 800; font-size: 12px; padding: 3px 9px; border-radius: 7px; }
.best h2 { margin: 10px 0 2px; font-size: 20px; line-height: 1.2; font-weight: 800; }
.best .where { margin: 0; color: #b2bcb7; font-size: 14px; }
.best .price { margin: 12px 0 2px; font-size: 40px; font-weight: 800; color: var(--lime); letter-spacing: -1px; line-height: 1; }
.best .how { margin: 0; font-size: 15px; font-weight: 600; }
.best .speed { color: #f2f5f1; }
.best .btn-ghost { color: #f2f5f1; }
.best .row-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.speed { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 14px; margin: 8px 0 0; flex-wrap: wrap; }
.bolts { display: inline-flex; gap: 1px; }
.bolts svg { width: 14px; height: 14px; }
.bolts .on { color: var(--lime-strong); }
.best .bolts .on { color: var(--lime); }
.bolts .off { color: currentColor; opacity: 0.25; }

/* Liste */
.rows { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); min-height: 72px; }
.row b { display: block; font-size: 16px; font-weight: 800; line-height: 1.25; }
.row .where { display: block; color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.row .speed { margin-top: 5px; font-size: 13px; }
.row-price { text-align: right; }
.row-price strong { display: block; font-size: 20px; font-weight: 800; line-height: 1.1; white-space: nowrap; }
.row-price small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 600; max-width: 8.5em; }
.row-price .free { color: var(--lime-text); }
.row-price .unknown { color: var(--ink-2); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: 12px; font-weight: 800; font-size: 15px; background: var(--surface-2); color: var(--ink); text-decoration: none; text-align: center; }
.btn-lime { background: var(--lime); color: var(--dark); }
.btn-dark { background: var(--ink); color: var(--bg); }
.btn-ghost { background: transparent; border: 1.5px solid currentColor; }
.btn-wide { width: 100%; }
.more { margin-top: 12px; }
.note { color: var(--ink-2); font-size: 14px; margin: 22px 4px 0; text-align: center; }
.empty { text-align: center; padding: 28px 12px; color: var(--ink-2); }
.empty b { display: block; color: var(--ink); font-size: 19px; margin-bottom: 6px; }

/* Carte */
.mapwrap { position: relative; height: calc(100dvh - var(--head-h) - var(--nav-h) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 380px; }
.jmap { position: absolute; inset: 0; overflow: hidden; touch-action: none; background: var(--sea); user-select: none; -webkit-user-select: none; }
.jmap-stage { position: absolute; inset: 0; transform-origin: 0 0; }
.jmap-tiles img { position: absolute; left: 0; top: 0; max-width: none; transform-origin: 0 0; pointer-events: none; }
.jmap-land { position: absolute; left: 0; top: 0; pointer-events: none; }
.jmap-land-fill { fill: var(--land); stroke: var(--land-line); stroke-width: 1.5; stroke-linejoin: round; }
.jmap-land-glow { fill: none; stroke: var(--lime-strong); stroke-opacity: 0.4; stroke-width: 10; stroke-linejoin: round; }
.jmap-pins { position: absolute; inset: 0; }
.jm-pin, .jm-cluster { position: absolute; left: 0; top: 0; }
.pin { position: absolute; left: 0; bottom: 8px; transform: translateX(-50%); display: block; white-space: nowrap; font-weight: 800; font-size: 14px; line-height: 1;
  padding: 6px 8px; border-radius: 10px; background: var(--surface); color: var(--ink); border: 2px solid var(--ink); }
.pin::after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--ink); border-bottom: 0; }
.pin.top { background: var(--lime); color: var(--dark); border-color: var(--dark); }
.pin.top::after { border-top-color: var(--dark); }
.pin.unknown { color: var(--ink-2); border-style: dashed; }
.is-selected .pin { transform: translateX(-50%) scale(1.2); box-shadow: 0 0 0 4px var(--lime-soft); }
.clu { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; border-radius: 50%; font-weight: 800; color: var(--lime); background: var(--dark); border: 3px solid var(--lime); }
.jmap-attrib { position: absolute; right: 4px; bottom: 4px; font-size: 10px; background: var(--surface); color: var(--ink-2); padding: 1px 6px; border-radius: 4px; pointer-events: none; }
.jmap-ui { position: absolute; z-index: 5; }
.mapctl { right: 12px; top: 12px; display: flex; flex-direction: column; gap: 10px; }
.mapctl button { width: 44px; height: 44px; border-radius: 13px; background: var(--surface); border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 22px; font-weight: 800; }
.legend { left: 12px; right: 68px; top: 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 7px 11px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.legend b { color: var(--ink); }
.mapstatus { left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--dark); color: #f2f5f1; font-size: 14px; font-weight: 700; padding: 9px 14px; border-radius: 12px; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }

/* Fiche */
.sheet-back { position: fixed; inset: 0; z-index: 70; background: rgba(5, 8, 7, 0.55); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 71; max-width: 560px; margin: 0 auto; background: var(--bg); border-radius: 26px 26px 0 0;
  padding: 10px 18px calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 92dvh; overflow-y: auto; }
.sheet-grab { width: 48px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet-head { display: flex; align-items: flex-start; gap: 10px; }
.sheet-head h2 { font-weight: 800; font-size: 20px; line-height: 1.2; margin: 0; }
.sheet-head p { margin: 4px 0 0; color: var(--ink-2); }
.x { margin-left: auto; width: 42px; height: 42px; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; flex: none; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up 220ms cubic-bezier(.2, .8, .2, 1); } }
@keyframes up { from { transform: translateY(40px); opacity: 0.4; } }

/* Éclair d’ouverture d’une borne */
.zap { position: fixed; inset: 0; z-index: 85; pointer-events: none; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 50%, rgba(220, 255, 94, 0.5) 0, rgba(220, 255, 94, 0.14) 30%, rgba(13, 17, 16, 0) 62%);
  animation: zap-bg 720ms ease-out forwards; }
.zap svg { width: 150px; height: 150px; overflow: visible; filter: drop-shadow(0 0 10px rgba(220, 255, 94, 0.95)) drop-shadow(0 0 30px rgba(220, 255, 94, 0.65));
  animation: zap-bolt 720ms cubic-bezier(.2, .9, .3, 1.2) forwards; }
.zap-fill { fill: #dcff5e; }
.zap-line { fill: none; stroke: #ffffff; stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; animation: zap-draw 420ms ease-out forwards; }
@keyframes zap-bg { 0% { opacity: 0; } 14% { opacity: 1; } 70% { opacity: 0.9; } 100% { opacity: 0; } }
@keyframes zap-bolt { 0% { transform: scale(0.3) rotate(-10deg); opacity: 0; } 24% { transform: scale(1.14) rotate(2deg); opacity: 1; } 44% { transform: scale(1) rotate(0deg); } 74% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
@keyframes zap-draw { to { stroke-dashoffset: 0; } }
.bigprice { margin-top: 14px; background: var(--dark); color: #f2f5f1; border-radius: 20px; padding: 16px; }
.bigprice > span { display: block; font-weight: 600; font-size: 14px; color: #b2bcb7; }
.bigprice b { display: block; font-size: 38px; font-weight: 800; color: var(--lime); letter-spacing: -1px; line-height: 1.05; margin: 4px 0; }
.bigprice .how { color: #f2f5f1; font-size: 15px; }
.bigprice .speed { color: #f2f5f1; }
.bigprice .bolts .on { color: var(--lime); }
.tip { margin-top: 14px; border-radius: 18px; background: var(--lime-soft); border: 2px solid var(--lime-strong); padding: 12px 14px; }
.tip p { margin: 0 0 10px; font-weight: 600; }
.tip p b { font-weight: 800; }
.alts { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; overflow: hidden; }
.alts li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 14px; align-items: center; }
.alts li + li { border-top: 1.5px solid var(--line); }
.alts .n { font-weight: 700; }
.alts .p { font-weight: 800; font-size: 17px; text-align: right; }
.alts .d { grid-column: 1 / -1; color: var(--ink-2); font-size: 14px; }
.alts .off { opacity: 0.6; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.favbtn { width: 100%; margin-top: 10px; }
.favbtn[aria-pressed="true"] { background: var(--lime); color: var(--dark); }
.moreinfo { margin-top: 18px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; }
.moreinfo summary { cursor: pointer; padding: 13px 14px; font-weight: 800; list-style: none; display: flex; justify-content: space-between; align-items: center; min-height: 46px; }
.moreinfo summary::-webkit-details-marker { display: none; }
.moreinfo summary::after { content: "+"; font-size: 24px; line-height: 1; }
.moreinfo[open] summary::after { content: "−"; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; margin: 0; padding: 0 16px 16px; font-size: 15px; }
.facts dt { color: var(--ink-2); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.meta { color: var(--ink-2); font-size: 15px; margin: 12px 2px 0; }

/* Premiers pas */
.ob { position: fixed; inset: 0; z-index: 80; background: var(--bg); overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(env(safe-area-inset-bottom, 0px) + 24px); }
.ob-in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100%; }
.ob-top { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.ob-dots { display: flex; gap: 6px; }
.ob-dots i { width: 28px; height: 8px; border-radius: 4px; background: var(--surface-2); }
.ob-dots i.on { background: var(--lime-strong); }
.ob-skip { margin-left: auto; font-weight: 700; color: var(--ink-2); min-height: 44px; padding: 0 6px; }
.ob h2 { font-size: 25px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.2; margin: 0 0 8px; }
.ob .lead { color: var(--ink-2); margin: 0 0 18px; font-size: 15px; }
.choices { display: grid; gap: 10px; }
.choices.two { grid-template-columns: 1fr 1fr; }
.choice { min-height: 50px; padding: 10px 14px; border-radius: 14px; background: var(--surface); border: 2px solid var(--line); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; text-align: left; }
.choice small { display: block; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.choice[aria-pressed="true"] { border-color: var(--ink); background: var(--lime-soft); }
.choice[aria-pressed="true"]::after { content: "✓"; margin-left: auto; font-weight: 800; font-size: 20px; }
.ob-label { font-weight: 800; font-size: 16px; margin: 20px 0 8px; }
.bigbatt { display: flex; align-items: center; gap: 16px; margin: 6px 0 4px; }
.bigbatt-body { position: relative; flex: 1; height: 50px; border: 3px solid var(--ink); border-radius: 12px; padding: 4px; }
.bigbatt-body::after { content: ""; position: absolute; right: -11px; top: 12px; width: 7px; height: 18px; border-radius: 0 5px 5px 0; background: var(--ink); }
.bigbatt-fill { height: 100%; border-radius: 8px; background: var(--lime-strong); min-width: 6px; }
.bigbatt-val { font-size: 32px; font-weight: 800; min-width: 3.2ch; text-align: right; margin-left: 10px; }
input[type="range"] { width: 100%; accent-color: var(--lime-strong); height: 44px; margin: 0; }
.ob-go { margin-top: auto; padding-top: 26px; }

/* Moi */
.save { background: var(--dark); color: #f2f5f1; border-radius: 20px; padding: 16px; border: 1px solid rgba(220, 255, 94, 0.25); }
.save span { display: block; color: #b2bcb7; font-weight: 600; }
.save b { display: block; font-size: 38px; font-weight: 800; color: var(--lime); letter-spacing: -1.5px; line-height: 1.1; margin: 4px 0; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; }
.card p { margin: 0 0 12px; }
.card b { font-weight: 800; }
.history { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.history li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 14px 16px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; }
.history .t { font-weight: 800; font-size: 17px; text-align: right; }
.history .s { color: var(--ink-2); font-size: 14px; }
.history .g { color: var(--lime-text); font-weight: 800; text-align: right; font-size: 14px; }
.adv { margin-top: 24px; }
.field { display: block; margin-bottom: 14px; }
.field span { display: block; font-weight: 700; margin-bottom: 4px; }
input[type="text"], select { font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; min-height: 46px; }
.err { display: block; color: var(--danger); font-size: 15px; margin-top: 6px; font-weight: 700; }
.err[hidden] { display: none; }
.hint { color: var(--ink-2); font-size: 14px; margin: 8px 0 0; }

/* Navigation */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 56; background: var(--surface); border-top: 1.5px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--nav-h); }
.nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--ink-2); font-size: 12px; font-weight: 800; }
.nav a .ico { width: 54px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
.nav a[aria-current="page"] { color: var(--ink); }
.nav a[aria-current="page"] .ico { background: var(--lime); color: var(--dark); }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 76px); transform: translateX(-50%); z-index: 90; background: var(--dark); color: #f2f5f1; border: 2px solid var(--lime); font-weight: 700; font-size: 15px; padding: 10px 16px; border-radius: 12px; width: max-content; max-width: calc(100% - 32px); text-align: center; }

/* Batterie qui se charge (en-tête) */
.mb-fill { transform-box: fill-box; transform-origin: left center; animation: mb-charge 2.8s ease-in-out infinite; }
.mb-bolt { animation: mb-bolt 1.4s ease-in-out infinite; }
@keyframes mb-charge {
  0% { transform: scaleX(0); opacity: 1; }
  68%, 88% { transform: scaleX(1); opacity: 1; }
  93% { transform: scaleX(1); opacity: 0.25; }
  94% { transform: scaleX(0); opacity: 1; }
  100% { transform: scaleX(0); opacity: 1; }
}
@keyframes mb-bolt { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

/* Carte : le courant fait le tour de la France */
.jmap-land-current { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2.4 22.6; animation: land-current 10s linear infinite; }
.cur-a { stroke: var(--spark); stroke-width: 5; }
.cur-b { stroke: #ffffff; stroke-width: 1.8; }
@keyframes land-current { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }

/* Carte : intro, la France s'allume en onde depuis la borne la moins chère */
.jmap.intro .jmap-land-fill { stroke-dasharray: 100; animation: land-draw 1.1s ease-out both, land-fill 1.3s ease-out both; }
.jmap.intro .jmap-land-glow { animation: glow-in 1.5s ease-out both; }
.jmap.intro .jmap-land-current { opacity: 0; }
.jmap.intro .pin { animation: pin-pop 440ms cubic-bezier(.2, .9, .3, 1.4) var(--d, 700ms) both; }
.jmap.intro .clu { animation: clu-pop 440ms cubic-bezier(.2, .9, .3, 1.4) var(--d, 700ms) both; }
.jmap.intro .sonar, .jmap.intro .sonar-dot { visibility: hidden; }
.pin { transform-origin: 50% calc(100% + 9px); }
@keyframes land-draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes land-fill { 0%, 45% { fill-opacity: 0; } 100% { fill-opacity: 1; } }
@keyframes glow-in { 0%, 55% { stroke-opacity: 0; } 78% { stroke-opacity: 1; } 100% { stroke-opacity: 0.4; } }
@keyframes pin-pop { from { transform: translateX(-50%) scale(0); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
@keyframes clu-pop { from { transform: translate(-50%, -50%) scale(0); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

/* Carte : la borne la moins chère émet des ondes */
.sonar-dot { position: absolute; left: 0; top: 0; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--spark); pointer-events: none; }
.sonar { position: absolute; left: 0; top: 0; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; pointer-events: none;
  border: 2.5px solid var(--spark); background: radial-gradient(circle, rgba(191, 232, 58, 0) 55%, rgba(191, 232, 58, 0.18) 100%);
  transform: scale(0.1); opacity: 0; animation: sonar 2.4s ease-out infinite; animation-delay: var(--sd, 0ms); }
.sonar.s2 { animation-delay: calc(var(--sd, 0ms) - 1200ms); }
@keyframes sonar { 0% { transform: scale(0.1); opacity: 0.95; } 100% { transform: scale(1); opacity: 0; } }
.clu.top { background: var(--lime); color: var(--dark); border-color: var(--dark); }

@media (prefers-reduced-motion: reduce) {
  .mb-fill, .mb-bolt, .jmap-land-current, .sonar, .jmap.intro * { animation: none !important; }
  .jmap-land-current, .sonar { display: none; }
}

/* Transparence du classement */
.ranknote { margin: 10px 2px 0; font-size: 13px; color: var(--ink-2); }
.ranknote button { font-weight: 800; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; min-height: 32px; }
.pricesrc { margin: 8px 2px 0; font-size: 13px; color: var(--ink-2); }
.howto p { margin: 0 0 12px; font-size: 15px; }
.howto b { font-weight: 800; }

/* Choix de l'appli GPS */
.go-back { z-index: 76; }
.gosheet { z-index: 77; }
.goapps { display: grid; gap: 8px; margin-top: 14px; }
.goapp { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); text-decoration: none; color: var(--ink); }
.goapp b { display: block; font-weight: 800; font-size: 16px; }
.goapp small { display: block; color: var(--ink-2); font-size: 13px; font-weight: 600; }
.goico { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; background: var(--c); color: #ffffff; }
.goico svg { width: 20px; height: 20px; transform: rotate(45deg); }
.check { display: flex; align-items: center; gap: 12px; min-height: 48px; font-weight: 700; font-size: 15px; }
.check input { width: 24px; height: 24px; accent-color: var(--lime-strong); flex: none; margin: 0; }
.goremember { margin-top: 10px; }

</style>

<script>
(function (root) {
  'use strict';

  var LOSSES = { AC: 0.10, DC: 0.05 };
  var DC_TAPER_FROM_PCT = 80;
  var DC_TAPER_FACTOR = 0.35;
  var MAX_MINUTES = 48 * 60;

  function clamp(v, min, max) {
    v = Number(v);
    if (!isFinite(v)) return min;
    return Math.min(max, Math.max(min, v));
  }

  function toMinutes(hhmm) {
    var parts = String(hhmm || '0:0').split(':');
    var h = Number(parts[0]);
    var m = Number(parts[1] || 0);
    if (!isFinite(h) || !isFinite(m)) return 0;
    return (((h * 60 + m) % 1440) + 1440) % 1440;
  }

  function inWindow(minuteOfDay, w) {
    var s = toMinutes(w.start);
    var e = toMinutes(w.end);
    if (s === e) return true;
    return s < e
      ? minuteOfDay >= s && minuteOfDay < e
      : minuteOfDay >= s || minuteOfDay < e;
  }

  function chargePowerKw(station, car) {
    var carMax = station.current === 'DC' ? car.dcKw : car.acKw;
    return Math.max(0, Math.min(Number(station.powerKw) || 0, Number(carMax) || 0));
  }

  function simulate(station, car, charge) {
    var startPct = clamp(charge.startPct, 0, 100);
    var targetPct = clamp(charge.targetPct, 0, 100);
    var res = {
      ok: true,
      reason: null,
      steps: [],
      gridKwh: 0,
      batteryKwh: 0,
      durationMin: 0,
      powerKw: chargePowerKw(station, car),
      startMinute: toMinutes(charge.startTime),
      endMinute: toMinutes(charge.startTime)
    };
    if (!(Number(car.batteryKwh) > 0)) { res.ok = false; res.reason = 'battery'; return res; }
    if (targetPct <= startPct) { res.ok = false; res.reason = 'target'; return res; }
    if (res.powerKw <= 0) { res.ok = false; res.reason = 'power'; return res; }

    var loss = LOSSES[station.current] != null ? LOSSES[station.current] : LOSSES.AC;
    var neededBatt = car.batteryKwh * (targetPct - startPct) / 100;
    var doneBatt = 0;
    var soc = startPct;
    var t = res.startMinute;

    while (doneBatt < neededBatt - 1e-9 && res.steps.length < MAX_MINUTES) {
      var gridPower = res.powerKw;
      if (station.current === 'DC' && soc >= DC_TAPER_FROM_PCT) gridPower *= DC_TAPER_FACTOR;
      var batt = Math.min(gridPower / 60 / (1 + loss), neededBatt - doneBatt);
      var grid = batt * (1 + loss);
      res.steps.push({ minuteOfDay: t, gridKwh: grid });
      res.gridKwh += grid;
      doneBatt += batt;
      soc = startPct + (doneBatt / car.batteryKwh) * 100;
      t = (t + 1) % 1440;
    }
    res.batteryKwh = doneBatt;
    res.durationMin = res.steps.length;
    res.endMinute = t;
    return res;
  }

  function tileUrl() {

  var topId = null, topSt = null, introSpan = 800;
  function km(aLat, aLon, bLat, bLon) {
    var toR = Math.PI / 180, dLat = (bLat - aLat) * toR, dLon = (bLon - aLon) * toR;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(aLat * toR) * Math.cos(bLat * toR) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 12742 * Math.asin(Math.sqrt(h));
  }

      '<h2 class="h3">Mes charges</h2>' + (P.history.length ? '<ul class="history">' + P.history.map(function (h) {
        return '<li><span><b>' + esc(h.station) + '</b><br><span class="s">' + esc(h.label) + ', le ' + new Date(h.at).toLocaleDateString('fr-FR') + '</span></span>' +
          '<span><span class="t num">' + fEur(h.total) + '</span><br><span class="g num">' + (h.saved > 0 ? fEur(h.saved) + ' économisés' : '') + '</span></span></li>';
      }).join('') + '</ul>' : '<p class="hint">Après une charge, touche « J’ai chargé ici » sur la borne pour suivre tes économies.</p>') +
      '<details class="moreinfo adv"><summary>Réglages avancés</summary><div style="padding:0 16px 16px">' +
      field('a-bat', 'Batterie de la voiture (kWh)', P.car.batteryKwh) + field('a-ac', 'Puissance max sur borne lente (kW)', P.car.acKw) + field('a-dc', 'Puissance max sur borne rapide (kW)', P.car.dcKw) +
      '<p class="hint">' + dataInfo() + '</p>' +
      '<button type="button" class="btn btn-wide" style="margin-top:12px" data-reset>Remettre les économies à zéro</button></div></details>';
    main.innerHTML = html;
    document.getElementById('p-gps').addEventListener('change', function (e) { P.gps = e.target.value; savePrefs(); toast(P.gps === 'ask' ? 'JUS te demandera à chaque fois' : gpsName(P.gps) + ' sera utilisé pour « Y aller »'); });
    [['a-bat', 'batteryKwh', 250], ['a-ac', 'acKw', 50], ['a-dc', 'dcKw', 400]].forEach(function (f) {
      var input = document.getElementById(f[0]), err = document.getElementById(f[0] + '-err');
      input.addEventListener('input', function () {
        var v = Number(input.value.replace(/\s/g, '').replace(',', '.'));
        if (!input.value.trim() || !isFinite(v) || v <= 0 || v > f[2]) { err.hidden = false; err.textContent = 'Entre un nombre entre 0 et ' + f[2] + '.'; return; }
        err.hidden = true; P.car[f[1]] = v; P.carId = 'custom'; savePrefs(); renderChrome();
      });
    });
  }
  function field(id, label, v) {
    return '<label class="field"><span>' + label + '</span><input id="' + id + '" type="text" inputmode="decimal" autocomplete="off" value="' + one.format(v) + '"><em class="err" id="' + id + '-err" role="alert" hidden></em></label>';
  }

  /* ---------- Premiers pas ---------- */
  var OB = null;
  function openSetup() {
    OB = { step: 1, carId: P.carId, startPct: P.charge.startPct, targetPct: P.charge.targetPct, when: P.charge.when, roaming: P.roaming };
    renderSetup();
  }
  function renderSetup() {
    var root = document.getElementById('ob-root');
    if (!OB) { root.innerHTML = ''; document.body.style.overflow = ''; return; }
    var dots = '<div class="ob-dots" aria-label="Étape ' + OB.step + ' sur 3">' + [1, 2, 3].map(function (i) { return '<i class="' + (i <= OB.step ? 'on' : '') + '"></i>'; }).join('') + '</div>';
    var body = '';
    if (OB.step === 1) {
      body = '<h2>Quelle est ta voiture&nbsp;?</h2><p class="lead">Pour calculer le prix exact de ta recharge.</p><div class="choices">' +
        D.CARS.map(function (c) { return '<button type="button" class="choice" data-car="' + c.id + '" aria-pressed="' + (OB.carId === c.id) + '">' + esc(c.id === 'custom' ? 'Autre voiture' : c.label) + '</button>'; }).join('') + '</div>';
    } else if (OB.step === 2) {
      body = '<h2>Ta batterie est à combien&nbsp;?</h2><p class="lead">Regarde le pourcentage sur ton tableau de bord.</p>' +
        '<div class="bigbatt"><div class="bigbatt-body"><div class="bigbatt-fill" id="ob-fill" style="width:' + OB.startPct + '%"></div></div><span class="bigbatt-val num" id="ob-val">' + OB.startPct + NB + '%</span></div>' +
        '<input id="ob-start" type="range" min="0" max="95" step="5" value="' + OB.startPct + '" aria-label="Batterie actuelle en pour cent">' +
        '<p class="ob-label">Jusqu’à combien veux-tu charger&nbsp;?</p><div class="choices two">' +
        '<button type="button" class="choice" data-target="80" aria-pressed="' + (OB.targetPct === 80) + '"><span>80&nbsp;%<small>conseillé, plus rapide</small></span></button>' +
        '<button type="button" class="choice" data-target="100" aria-pressed="' + (OB.targetPct === 100) + '"><span>100&nbsp;%<small>batterie pleine</small></span></button></div>' +
        '<p class="ob-label">Quand veux-tu charger&nbsp;?</p><div class="choices two">' +
        '<button type="button" class="choice" data-when="now" aria-pressed="' + (OB.when === 'now') + '">Maintenant</button>' +
        '<button type="button" class="choice" data-when="night" aria-pressed="' + (OB.when === 'night') + '"><span>Cette nuit<small>à partir de 22&nbsp;h</small></span></button></div>';
    } else {
      body = '<h2>As-tu un badge de recharge&nbsp;?</h2><p class="lead">C’est une carte qui sert à payer la recharge sur plusieurs réseaux. Si tu ne sais pas, réponds non : JUS comparera la carte bancaire et les applis.</p><div class="choices">' +
        '<button type="button" class="choice" data-roam="1" aria-pressed="' + OB.roaming + '">Oui, j’en ai un</button>' +
        '<button type="button" class="choice" data-roam="0" aria-pressed="' + !OB.roaming + '">Non, ou je ne sais pas</button></div>';
    }
    var go = OB.step < 3 ? '<button type="button" class="btn btn-lime btn-wide" data-ob-next>Suivant</button>' : '<button type="button" class="btn btn-lime btn-wide" data-ob-done>Voir les bornes</button>';
    var back = OB.step > 1 ? '<button type="button" class="btn btn-wide" style="margin-top:10px" data-ob-back>Retour</button>' : '';
    root.innerHTML = '<div class="ob" role="dialog" aria-modal="true" aria-label="Réglages de ta charge"><div class="ob-in"><div class="ob-top">' + dots +
      '<button type="button" class="ob-skip" data-ob-done>' + (P.onboarded ? 'Fermer' : 'Passer') + '</button></div>' + body + '<div class="ob-go">' + go + back + '</div></div></div>';
    document.body.style.overflow = 'hidden';
    var st = document.getElementById('ob-start');
    if (st) st.addEventListener('input', function () {
      OB.startPct = +st.value;
      document.getElementById('ob-fill').style.width = OB.startPct + '%';
      document.getElementById('ob-val').textContent = OB.startPct + NB + '%';
    });
  }
  function finishSetup() {
    if (OB.carId !== P.carId && OB.carId !== 'custom') P.car = presetCar(OB.carId);
    P.carId = OB.carId;
    P.charge.startPct = Math.min(OB.startPct, OB.targetPct - 5);
    P.charge.targetPct = OB.targetPct;
    P.charge.when = OB.when;
    P.charge.startTime = OB.when === 'night' ? '22:00' : nowHHMM();
    P.roaming = OB.roaming;
    P.onboarded = true;
    OB = null;
    savePrefs();
    renderSetup();
    refreshAll();
  }

  /* ---------- Divers ---------- */
  var toastTimer = 0;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 2800);
  }
  function locate(then) {
    if (!navigator.geolocation) { toast('Localisation indisponible sur cet appareil'); return; }
    toast('Recherche de ta position…');
    navigator.geolocation.getCurrentPosition(function (pos) {
      P.here = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      P.mapView = { lon: P.here.lon, lat: P.here.lat, zoom: S.mode === 'live' ? 13 : 9 };
      savePrefs();
      document.getElementById('toast').hidden = true;
      if (then) then();
    }, function () { toast('Impossible de trouver ta position ici'); }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 });
  }

  function render() {
    var h = (location.hash || '#/').replace(/^#\/?/, '');
    S.view = h === 'carte' ? 'map' : h === 'moi' ? 'me' : 'list';
    document.body.classList.toggle('view-map', S.view === 'map');
    if (S.view !== 'map') S.map = null;
    renderChrome();
    if (S.view === 'map') viewMap(); else if (S.view === 'me') viewMe(); else viewList();
    window.scrollTo(0, 0);
  }
  function refreshAll() {
    renderChrome();
    if (S.view === 'list') viewList();
    else if (S.view === 'map' && S.map) S.map.setStations(mapStations());
    else if (S.view === 'me') viewMe();
    refreshSheet();
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, a');
    if (!t) return;
    if (t.hasAttribute('data-go-close')) { closeGo(); return; }
    if (t.hasAttribute('data-go')) { goTo(t.getAttribute('data-go')); return; }
    if (t.hasAttribute('data-gps')) {
      var rem = document.getElementById('go-remember');
      if (rem && rem.checked) { P.gps = t.getAttribute('data-gps'); savePrefs(); toast(gpsName(P.gps) + ' sera utilisé pour « Y aller »'); }
      setTimeout(closeGo, 400);
      return;
    }
    if (t.hasAttribute('data-close')) { closeSheet(); return; }
    if (t.hasAttribute('data-open')) { var oid = t.getAttribute('data-open'); zapThen(function () { openStation(oid); }); return; }
    if (t.hasAttribute('data-setup')) { openSetup(); return; }
    if (t.hasAttribute('data-car')) { OB.carId = t.getAttribute('data-car'); renderSetup(); return; }
    if (t.hasAttribute('data-target')) { OB.targetPct = +t.getAttribute('data-target'); renderSetup(); return; }
    if (t.hasAttribute('data-when')) { OB.when = t.getAttribute('data-when'); renderSetup(); return; }
    if (t.hasAttribute('data-roam')) { OB.roaming = t.getAttribute('data-roam') === '1'; renderSetup(); return; }
    if (t.hasAttribute('data-ob-next')) { OB.step += 1; renderSetup(); document.querySelector('.ob').scrollTop = 0; return; }
    if (t.hasAttribute('data-ob-back')) { OB.step -= 1; renderSetup(); return; }
    if (t.hasAttribute('data-ob-done')) { finishSetup(); return; }
    if (t.hasAttribute('data-sort')) {
      var v = t.getAttribute('data-sort');
      if (v === 'near' && !P.here) { locate(function () { S.sort = 'near'; if (S.mode === 'live') maybeLoad(); viewList(); }); return; }
      S.sort = v; S.listLimit = 8; viewList(); return;
    }
    if (t.hasAttribute('data-more')) { S.listLimit += 8; viewList(); return; }
    if (t.hasAttribute('data-night')) { P.charge.when = 'night'; P.charge.startTime = '22:00'; savePrefs(); refreshAll(); toast('Prix recalculés pour cette nuit'); return; }
    if (t.hasAttribute('data-charged')) { charged(t.getAttribute('data-charged')); return; }
    if (t.hasAttribute('data-fav')) {
      var id = t.getAttribute('data-fav'), i = P.favs.indexOf(id);
      if (i >= 0) P.favs.splice(i, 1); else P.favs.push(id);
      savePrefs(); refreshSheet();
      toast(i >= 0 ? 'Retirée de tes favoris' : 'Ajoutée à tes favoris');
      return;
    }
    if (t.hasAttribute('data-howto')) { openHowto(); return; }
    if (t.hasAttribute('data-snap')) { toast('Bientôt : prends l’étiquette en photo, JUS lit le prix'); return; }
    if (t.hasAttribute('data-reset')) { P.saved = 0; P.history = []; savePrefs(); viewMe(); toast('Économies remises à zéro'); return; }
    if (t.hasAttribute('data-zoom') && S.map) { S.map.zoomBy(+t.getAttribute('data-zoom')); return; }
    if (t.hasAttribute('data-locate')) { locate(function () { if (S.map) S.map.setView(P.here.lon, P.here.lat, S.mode === 'live' ? 13 : 9, true); }); return; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (document.getElementById('go-root')) { closeGo(); return; }
    if (OB && P.onboarded) { OB = null; renderSetup(); } else if (document.querySelector('.sheet')) closeSheet();
  });
  window.addEventListener('hashchange', function () { closeSheet(); render(); });

  /* ---------- Démarrage ---------- */
  function probeTiles() {
    var img = new Image();
    img.onload = function () { S.tilesOk = true; if (S.map) S.map.enableTiles(true); };
    img.src = tileUrl().replace('{s}', 'a').replace('{z}', '5').replace('{x}', '16').replace('{y}', '11').replace('{r}', '');
  }
  function goLive(source) {
    S.mode = 'live'; S.source = source; S.pool = [];
    if (!P.mapView || P.mapView.zoom < minZoom()) P.mapView = P.here ? { lon: P.here.lon, lat: P.here.lat, zoom: 13 } : { lon: 2.3488, lat: 48.8534, zoom: 12.5 };
    if (S.view === 'list') viewList();
    if (S.view === 'map' && S.map) { S.map.setStations([]); S.map.setView(P.mapView.lon, P.mapView.lat, P.mapView.zoom, true); } else maybeLoad();
  }

  render();
  if (!P.onboarded) openSetup();
  probeTiles();
  if (typeof fetch === 'function') {
    L.tilesIndex().then(function () { goLive('tiles'); }, function () {
      return L.probe().then(function () { goLive('odre'); });
    }).catch(function () { if (S.view === 'map') setStatus('Démo : ' + D.DEMO.length + ' bornes fictives'); });
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
  }
})();

</script>
</body>
</html>
